<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }
  .panel {
    width: 400px;
    margin: 10px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(20, 22, 28, 0.55);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    color: #f2f3f5;
  }
  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 14px;
    opacity: 0.9;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    margin-bottom: 10px;
    -webkit-app-region: no-drag;
  }
  .label { font-size: 13px; opacity: 0.85; }
  .hint { font-size: 11px; opacity: 0.5; margin-top: 2px; }
  .switch {
    width: 42px; height: 24px; border-radius: 12px;
    background: rgba(255,255,255,0.15);
    position: relative; cursor: pointer;
    transition: background 0.2s ease;
  }
  .switch.on { background: #5b8cff; }
  .knob {
    width: 18px; height: 18px; border-radius: 50%;
    background: white; position: absolute; top: 3px; left: 3px;
    transition: left 0.2s ease;
  }
  .switch.on .knob { left: 21px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">Peakio Client — Settings</div>
    <div class="row">
      <div>
        <div class="label">Unlimited FPS</div>
        <div class="hint">Ctrl + / to toggle anytime</div>
      </div>
      <div class="switch" id="fpsSwitch"><div class="knob"></div></div>
    </div>
  </div>
<script>
  const sw = document.getElementById('fpsSwitch');
  sw.addEventListener('click', async () => {
    const state = await window.peakio.toggleFps();
    sw.classList.toggle('on', state);
  });
  window.peakio.onFpsState((state) => sw.classList.toggle('on', state));
  window.peakio.getFpsState().then((state) => sw.classList.toggle('on', state));
</script>
</body>
</html>
