name: Build Peakio Client

on:
  workflow_dispatch:      # lets you click "Run workflow" manually on GitHub
  push:
    tags:
      - 'v*'              # also auto-builds when you push a tag like v0.1.0

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: peakio-client-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn
